name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"
      - ".github/scripts/decorate_snake.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out decoration script
        uses: actions/checkout@v4

      - name: Generate light and dark SVG animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: AaryanByteForge
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23F97316&color_dots=%23EEEAF7,%230e4429,%23006d32,%2326a641,%2339d353
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FBBF24&color_dots=%23232639,%230e4429,%23006d32,%2326a641,%2339d353

      - name: Add decorative green squares (illustrative, not actual contributions)
        run: python3 .github/scripts/decorate_snake.py

      - name: Publish animations to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
